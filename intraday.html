  $('reviewPanel').hidden = !reviewRows.length;
  $('reviewSession').textContent=review ? review.session+' · '+review.data_status+' · '+when(review.generated_at) : 'Ainda sem revisão pós-fechamento';
  $('reviewBody').innerHTML=review && reviewRows.length ? reviewRows.map(r=>`<tr><td>${esc(r.ticker)}</td><td>${esc(r.side||'—')}</td><td>${esc(r.status_label)}</td><td>${r.gap_pct==null?'—':num(r.gap_pct)+'%'}</td><td>${money(r.trigger)}</td><td>${money(r.initial_stop)}</td><td>${money(r.exit_price)}</td><td>${num(r.r_theoretical)}</td><td class="reason">${esc(r.reasons.join(' · '))||'—'}</td></tr>`).join('') : `<tr><td class="empty" colspan="9">${esc(review?.note || (review ? 'Nenhum evento registrado.' : 'Aguardando atualização no fechamento.'))}</td></tr>`;
  // 01/10/2026: copy only ACTIVE tickers (filters approved). "Em observação" rows
  // (e.g. a 6-K without verified first disclosure) never go to the clipboard.
  const copyRows=()=>visibleRows().filter(approved);
  const copyLabel=()=>{const n=copyRows().length,b=$('copyTickers');b.textContent=`Copiar tickers ativos (${n})`;b.disabled=!n;
    b.title='Copia só os ativos aprovados nos filtros, sem os "Em observação", separados por vírgula: cola direto no painel EP e no TradingView.';};
  const copyText=async text=>{
    try{await navigator.clipboard.writeText(text);return true;}catch(_){}
    try{const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok;}catch(_){return false;}
  };
  $('copyTickers').addEventListener('click',async()=>{
    const list=copyRows().map(r=>r.ticker),b=$('copyTickers');
    b.textContent=await copyText(list.join(','))?`Copiados ${list.length}: ${list.join(', ')}`:'Falhou — use Exportar CSV';
    setTimeout(copyLabel,4000);
  });
  $('search').addEventListener('input',render);render();
  $('export').addEventListener('click',()=>{
    const columns=['session','ticker','ticker_aliases','ep_screening_state','ep_screening_failed_reasons','ep_screening_pending_reasons','display_state','observation_note','reference_close','reference_asof','radar_state','filters_pass','side','event_form','event_kind','event_source','event_source_url','event_verified','event_entry_eligible','event_at_et','observed_at_et','status','gap_pct','adv20','trigger','initial_stop','score','quote_asof_et','reconstructed'];
    const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';
    const csv=[columns.join(','),...visibleRows().map(r=>{const value={...r,display_state:(r.radar_screening||r.ep_screening)?.display_state,observation_note:(r.radar_screening||r.ep_screening)?.observation_note,radar_state:screening(r).state,ep_screening_state:r.ep_screening?.state,ep_screening_failed_reasons:(r.ep_screening?.failed_reasons||[]).join(' · '),ep_screening_pending_reasons:(r.ep_screening?.pending_reasons||[]).join(' · ')};return columns.map(k=>cell(value[k])).join(',');})].join('\r\n');
    const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='ep_observacoes_'+d.session+'.csv';a.click();URL.revokeObjectURL(url);
  });
  function eventInstant(value){
    const text=String(value||'');
    if(!text)return NaN;
    if(/(?:Z|[+-]\d\d:\d\d)$/.test(text))return Date.parse(text);
    const wall=Date.parse(text+'Z');if(!Number.isFinite(wall))return NaN;
    const zone=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',timeZoneName:'longOffset'}).formatToParts(new Date(wall)).find(part=>part.type==='timeZoneName')?.value;
    return zone?Date.parse(text+zone.replace('GMT','')):NaN;
  }
  const healthStorageKey='ep-last-failed-health';
  let lastHealthFailure=null,latestHealth=null;
  try{lastHealthFailure=JSON.parse(sessionStorage.getItem(healthStorageKey)||'null');}catch(_){/* storage may be unavailable for a local file */}
  function keepHealthFailure(value){
    lastHealthFailure=value;
    try{if(value)sessionStorage.setItem(healthStorageKey,JSON.stringify(value));else sessionStorage.removeItem(healthStorageKey);}catch(_){/* in-memory warning remains active */}
  }
  async function freshness(){
    const note=$('freshness'),now=new Date();
    const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
    const dateLabel=value=>String(value).split('-').reverse().join('/');
    const sessionRelation=d.session<today?'sessão histórica':d.session===today?'sessão de hoje':'próximo pregão';
    $('candidateTitle').textContent='Radar EP — '+sessionRelation+' · '+dateLabel(d.session);
    const messages=[];
    if(d.session<today)messages.push('Sessão histórica de '+dateLabel(d.session)+'. Hoje é '+dateLabel(today)+' (ET); a lista exibida não é a de hoje.');
    const sourceFailure=(d.collection_coverage?.source_audit||[]).some(source=>['FAILED','UNAVAILABLE','ERROR','PARTIAL'].includes(String(source.status||'').toUpperCase()));
    if(sourceFailure||['PARTIAL','UNAVAILABLE'].includes(d.collection_coverage?.status))messages.push('Coleta incompleta: há fontes indisponíveis.');
    const et=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(now).map(part=>[part.type,part.value]));
    const clockLabel=instant=>new Intl.DateTimeFormat('pt-BR',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(instant));
    const healthSchedule=()=>{
      const health=latestHealth?.session===today?latestHealth:lastHealthFailure?.session===today?lastHealthFailure:null;
      const entries=Array.isArray(health?.scheduled_slots_et)?health.scheduled_slots_et:[];
      const initialAt=eventInstant(entries.find(item=>item?.slot==='INITIAL')?.scheduled_at);
      const revalidationAt=eventInstant(entries.find(item=>item?.slot==='REVALIDATION')?.scheduled_at);
      const asEtDate=instant=>Number.isFinite(instant)?new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(instant)):null;
      const verified=asEtDate(initialAt)===today && asEtDate(revalidationAt)===today && revalidationAt>initialAt;
      return {health,verified,initialAt:verified?initialAt:eventInstant(today+'T09:00:00'),revalidationAt:verified?revalidationAt:eventInstant(today+'T09:25:00')};
    };
    const nextRound=schedule=>{
      const nextAt=schedule.verified?eventInstant(schedule.health?.next_scheduled_at):NaN;
      if(Number.isFinite(nextAt) && nextAt>now.getTime())return 'Próxima rodada: '+when(new Date(nextAt).toISOString())+'.';
      if(now.getTime()<schedule.initialAt)return 'Próxima rodada: '+dateLabel(today)+' às '+clockLabel(schedule.initialAt)+' ET.';
      if(now.getTime()<schedule.revalidationAt)return 'Próxima rodada: '+dateLabel(today)+' às '+clockLabel(schedule.revalidationAt)+' ET.';
      if(schedule.health?.status==='RUNNING' && schedule.health?.slot==='REVALIDATION')return 'Revalidação das '+clockLabel(schedule.revalidationAt)+' ET em andamento.';
      return 'Próxima rodada: próxima sessão, às 09:00 ET.';
    };
    const slotWarning=schedule=>{
      if(d.session!==today || d.workflow!=='PREMARKET_AND_POSTCLOSE' || ['Sat','Sun'].includes(et.weekday))return '';
      // These are two scheduled collections, not a recurring age-based refresh.
      // Allow each slot its three-minute execution window before warning.
      const revalidation=now.getTime()>=schedule.revalidationAt+3*60*1000;
      const expectedAt=revalidation?schedule.revalidationAt:now.getTime()>=schedule.initialAt+3*60*1000?schedule.initialAt:null;
      if(expectedAt===null)return '';
      const collectedAt=eventInstant(d.event_generated_at_et);
      if(Number.isFinite(collectedAt) && collectedAt>=expectedAt && collectedAt<=now.getTime()+60000)return '';
      return (revalidation?'Revalidação':'Coleta inicial')+' das '+clockLabel(expectedAt)+' ET de '+dateLabel(today)+' ainda não confirmada. Última coleta: '+eventWhen(d.event_generated_at_et)+'.';
    };
    let versionMessage='';
    const show=()=>{
      // A later successful manual collection can supersede a failed scheduled run.
      // Prefer the collection time; merely rebuilding old events must not clear it.
      const snapshotAt=eventInstant(d.event_generated_at_et||d.generated_at),failureAt=eventInstant(lastHealthFailure?.updated_at);
      if(d.session===today && lastHealthFailure?.session===today && Number.isFinite(snapshotAt) && Number.isFinite(failureAt) && snapshotAt>failureAt)keepHealthFailure(null);
      const schedule=healthSchedule(),failed=lastHealthFailure?.session===today;
      $('scheduleStamp').textContent='Rodadas antes da abertura: '+clockLabel(schedule.initialAt)+' e '+clockLabel(schedule.revalidationAt)+' ET';
      $('eventStamp').title='Painel gerado: '+when(d.generated_at)+' · '+$('scheduleStamp').textContent;
      const failureMessage=failed?'A atualização EP antes da abertura de '+dateLabel(today)+' falhou. A lista desta sessão ainda não foi confirmada pela rotina. '+nextRound(schedule):'';
      const missingSlot=slotWarning(schedule);
      note.textContent=[...messages,missingSlot,failureMessage,versionMessage].filter(Boolean).join(' ');
      note.hidden=!note.textContent;note.className=failed?'notice error':'notice';
      note.title=failed?String(lastHealthFailure.message||''):'';
    };
    show();
    await Promise.allSettled([
      (async()=>{
        const response=await fetch('./intraday_version.json?v='+Date.now(),{cache:'no-store'});
        if(response.ok){const version=await response.json();if(version.build_id!==d.build_id)versionMessage='Uma versão mais recente foi publicada. Recarregue a página.';show();}
      })(),
      (async()=>{
        const response=await fetch('./ep_health.json?v='+Date.now(),{cache:'no-store'});
        if(!response.ok)return;
        const health=await response.json(),status=String(health.status??health.runstatus??'').toUpperCase();
        if(health.session!==today)return;
        latestHealth=health;
        if(status==='FAILED')keepHealthFailure({session:today,message:String(health.message||'').slice(0,300),updated_at:health.updated_at,
          schedule_policy:health.schedule_policy,scheduled_slots_et:health.scheduled_slots_et,slot:health.slot,scheduled_at:health.scheduled_at,next_scheduled_at:health.next_scheduled_at});
        else if(status==='SUCCESS')keepHealthFailure(null);
        show();
      })(),
    ]);
  }
  freshness();setInterval(freshness,60000);
})();
</script></body></html>
